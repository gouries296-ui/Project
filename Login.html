<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

<body>

<header>

         <div class="logo" style="margin-right:700px;">HONEYSHIELD</div>
          
    <nav>
            <a href="Index.html" style="margin-left: 600px;">Back to Home</a>
            <button type="button">
                Login
            </button>
        </nav>
       
         <h1>LOGIN</h1>

    </header>
<div class="login-container">

    <div class="login-box">

      
       

<hr><br>

        
        <center>

        <!-- Login Form -->
        <form class="login-form" onsubmit="loginUser(event)">

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >

            </div><br>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

            </div><br>


            <button type="submit">
                LOGIN
            </button>

        </form>
      <br>

        <p class="register">

            Don't have an account?

            <a href="Registration.html">
                 Register
            </a>

        </p>

    </div>

</div>
</center>

</footer>

</body>
