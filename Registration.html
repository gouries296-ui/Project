<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Register | HoneyShield</title>

<link rel="stylesheet" href="style.css">


</head>
<header>
     <div class="logo" style="margin-right:700px;">HONEYSHIELD</div>
    </header>

<body>

<div class="register-container">

    <nav>
        <a href="Index.html" style="margin-left: 700px;">Back to Home</a>
    </nav>

    <hr>

    <p class="register-subtitle">
        Create Your Account
    </p>

    <br>


    <!-- Registration Form -->
 <center>
    <form class="register-form" onsubmit="registerUser(event)">

        <div class="form-group">

            <label for="fullname">
                Full Name
            </label>

            <input
                type="text"
                id="fullname"
                placeholder="Enter your full name"
                required
            >

        </div><br>


        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Choose a username"
                required
            >

        </div>
        <br>


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required style="margin-left: 30px;"
            >

        </div><br>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >

        </div><br>


        <div class="form-group">

            <label for="confirmPassword" >
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                 required 
            >

        </div><br>


        <button type="submit">
            CREATE ACCOUNT
        </button>

    </form>
<br>
    <p class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </p>

</div>

</center>
<footer>

    <p>
        <strong>
            Honeypot-Based Ransomware Early Warning System
        </strong>
    </p>

    <p>
        B.Sc. Computer Science • Academic Year 2026–2027
    </p>

</footer>


<!-- JavaScript -->

<script src="javascript.js"></script>


</body>

</html>
